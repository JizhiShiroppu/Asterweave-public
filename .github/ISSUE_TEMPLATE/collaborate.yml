name: 想参与协作
description: 找一件感兴趣的小事，一起推进
title: "[协作] "
body:
  - type: textarea
    id: interest
    attributes:
      label: 你对哪部分感兴趣？
      description: 视觉、规则、几何、前端、测试或其他方向都可以。
    validations:
      required: true
  - type: textarea
    id: first-step
    attributes:
      label: 想先做的一件小事
      description: 可以附草图、示例输入或相关作品；还没想好也可以直接说明。
    validations:
      required: true
  - type: textarea
    id: support
    attributes:
      label: 需要什么资料或配合？
      description: 不要填写密码、个人联系方式或其他隐私，先在这里公开沟通即可。
