<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 650" role="img" aria-label="两道轮廓的相交、合并与扣除范围" style="color:#f2ba70"><title>两道轮廓的相交、合并与扣除范围</title><rect x="0" y="0" width="1360" height="650" fill="#171b21" /><rect width="1360" height="650" fill="#0d1b20" /><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="55" y="59" font-size="13" fill="#d7bd88" letter-spacing="3">ASTERWEAVE / 基础几何与范围关系</text><text x="55" y="109" font-size="32" fill="#e4ddca">两形之间，范围不同。</text><text x="55" y="149" font-size="14" fill="#9aaba1">同一个方形A与圆形B，分别取相交、合并和排除区域；内层纹样不自动形成孔洞。</text><svg x="35" y="195" width="410" height="330" viewBox="-270 -225 540 450" role="img" aria-label="两形之间的范围，图样组合研究" class="pattern-art"><rect x="-540" y="-540" width="1080" height="1080" fill="#0d1b20" /><g transform="rotate(0)" stroke-linecap="round" stroke-linejoin="round"><g data-composition-layer="surround" data-conductive="false" transform="scale(1)" /><defs><clipPath id="scope-0-scope-a" clipPathUnits="userSpaceOnUse"><path transform="translate(-65 0) rotate(45) scale(1.6)" d="M-69.2965 -69.2965 L69.2965 -69.2965 L69.2965 69.2965 L-69.2965 69.2965 Z" fill="white" fill-rule="nonzero" /></clipPath><clipPath id="scope-0-scope-b" clipPathUnits="userSpaceOnUse"><circle transform="translate(72 0) rotate(0) scale(1.45)" cx="0" cy="0" r="96" fill="white" /></clipPath><clipPath id="scope-0-scope-union" clipPathUnits="userSpaceOnUse"><path transform="translate(-65 0) rotate(45) scale(1.6)" d="M-69.2965 -69.2965 L69.2965 -69.2965 L69.2965 69.2965 L-69.2965 69.2965 Z" fill="white" fill-rule="nonzero" /><circle transform="translate(72 0) rotate(0) scale(1.45)" cx="0" cy="0" r="96" fill="white" /></clipPath><mask id="scope-0-scope-difference" maskUnits="userSpaceOnUse" x="-665" y="-665" width="1330" height="1330" style="mask-type:luminance"><rect x="-665" y="-665" width="1330" height="1330" fill="black" /><path transform="translate(-65 0) rotate(45) scale(1.6)" d="M-69.2965 -69.2965 L69.2965 -69.2965 L69.2965 69.2965 L-69.2965 69.2965 Z" fill="white" fill-rule="nonzero" /><circle transform="translate(72 0) rotate(0) scale(1.45)" cx="0" cy="0" r="96" fill="black" /></mask></defs><g data-scope="geometric-scope" data-operation="intersection" data-conductive="false"><g clip-path="url(#scope-0-scope-a)"><g clip-path="url(#scope-0-scope-b)"><rect x="-665" y="-665" width="1330" height="1330" fill="#81b9ad" opacity=".12" /></g></g></g><g data-composition-layer="relations" /><g data-node="area-a" data-motif="square" transform="translate(-65 0) rotate(45) scale(1.6)"><circle r="128" fill="transparent" stroke="none" data-hit="true" /><path d="M-69.2965 -69.2965 L69.2965 -69.2965 L69.2965 69.2965 L-69.2965 69.2965 Z" fill="none" stroke="#e2c58b" stroke-width="1.3" data-layer="frame" /></g><g data-node="area-b" data-motif="circle" transform="translate(72 0) rotate(0) scale(1.45)"><circle r="128" fill="transparent" stroke="none" data-hit="true" /><circle cx="0" cy="0" r="96" fill="none" stroke="#e2c58b" stroke-width="1.2" data-layer="frame" /></g></g></svg><text x="47" y="549" font-size="20" fill="#d7bd88">相交区域</text><text x="47" y="578" font-size="12" fill="#9aaba1">只取同时位于两道闭合轮廓内部的区域。</text><svg x="475" y="195" width="410" height="330" viewBox="-270 -225 540 450" role="img" aria-label="两形之间的范围，图样组合研究" class="pattern-art"><rect x="-540" y="-540" width="1080" height="1080" fill="#0d1b20" /><g transform="rotate(0)" stroke-linecap="round" stroke-linejoin="round"><g data-composition-layer="surround" data-conductive="false" transform="scale(1)" /><defs><clipPath id="scope-1-scope-a" clipPathUnits="userSpaceOnUse"><path transform="translate(-65 0) rotate(45) scale(1.6)" d="M-69.2965 -69.2965 L69.2965 -69.2965 L69.2965 69.2965 L-69.2965 69.2965 Z" fill="white" fill-rule="nonzero" /></clipPath><clipPath id="scope-1-scope-b" clipPathUnits="userSpaceOnUse"><circle transform="translate(72 0) rotate(0) scale(1.45)" cx="0" cy="0" r="96" fill="white" /></clipPath><clipPath id="scope-1-scope-union" clipPathUnits="userSpaceOnUse"><path transform="translate(-65 0) rotate(45) scale(1.6)" d="M-69.2965 -69.2965 L69.2965 -69.2965 L69.2965 69.2965 L-69.2965 69.2965 Z" fill="white" fill-rule="nonzero" /><circle transform="translate(72 0) rotate(0) scale(1.45)" cx="0" cy="0" r="96" fill="white" /></clipPath><mask id="scope-1-scope-difference" maskUnits="userSpaceOnUse" x="-665" y="-665" width="1330" height="1330" style="mask-type:luminance"><rect x="-665" y="-665" width="1330" height="1330" fill="black" /><path transform="translate(-65 0) rotate(45) scale(1.6)" d="M-69.2965 -69.2965 L69.2965 -69.2965 L69.2965 69.2965 L-69.2965 69.2965 Z" fill="white" fill-rule="nonzero" /><circle transform="translate(72 0) rotate(0) scale(1.45)" cx="0" cy="0" r="96" fill="black" /></mask></defs><g data-scope="geometric-scope" data-operation="union" data-conductive="false"><g clip-path="url(#scope-1-scope-union)"><rect x="-665" y="-665" width="1330" height="1330" fill="#81b9ad" opacity=".12" /></g></g><g data-composition-layer="relations" /><g data-node="area-a" data-motif="square" transform="translate(-65 0) rotate(45) scale(1.6)"><circle r="128" fill="transparent" stroke="none" data-hit="true" /><path d="M-69.2965 -69.2965 L69.2965 -69.2965 L69.2965 69.2965 L-69.2965 69.2965 Z" fill="none" stroke="#e2c58b" stroke-width="1.3" data-layer="frame" /></g><g data-node="area-b" data-motif="circle" transform="translate(72 0) rotate(0) scale(1.45)"><circle r="128" fill="transparent" stroke="none" data-hit="true" /><circle cx="0" cy="0" r="96" fill="none" stroke="#e2c58b" stroke-width="1.2" data-layer="frame" /></g></g></svg><text x="487" y="549" font-size="20" fill="#d7bd88">合并区域</text><text x="487" y="578" font-size="12" fill="#9aaba1">取位于任一道闭合轮廓内部的区域。</text><svg x="915" y="195" width="410" height="330" viewBox="-270 -225 540 450" role="img" aria-label="两形之间的范围，图样组合研究" class="pattern-art"><rect x="-540" y="-540" width="1080" height="1080" fill="#0d1b20" /><g transform="rotate(0)" stroke-linecap="round" stroke-linejoin="round"><g data-composition-layer="surround" data-conductive="false" transform="scale(1)" /><defs><clipPath id="scope-2-scope-a" clipPathUnits="userSpaceOnUse"><path transform="translate(-65 0) rotate(45) scale(1.6)" d="M-69.2965 -69.2965 L69.2965 -69.2965 L69.2965 69.2965 L-69.2965 69.2965 Z" fill="white" fill-rule="nonzero" /></clipPath><clipPath id="scope-2-scope-b" clipPathUnits="userSpaceOnUse"><circle transform="translate(72 0) rotate(0) scale(1.45)" cx="0" cy="0" r="96" fill="white" /></clipPath><clipPath id="scope-2-scope-union" clipPathUnits="userSpaceOnUse"><path transform="translate(-65 0) rotate(45) scale(1.6)" d="M-69.2965 -69.2965 L69.2965 -69.2965 L69.2965 69.2965 L-69.2965 69.2965 Z" fill="white" fill-rule="nonzero" /><circle transform="translate(72 0) rotate(0) scale(1.45)" cx="0" cy="0" r="96" fill="white" /></clipPath><mask id="scope-2-scope-difference" maskUnits="userSpaceOnUse" x="-665" y="-665" width="1330" height="1330" style="mask-type:luminance"><rect x="-665" y="-665" width="1330" height="1330" fill="black" /><path transform="translate(-65 0) rotate(45) scale(1.6)" d="M-69.2965 -69.2965 L69.2965 -69.2965 L69.2965 69.2965 L-69.2965 69.2965 Z" fill="white" fill-rule="nonzero" /><circle transform="translate(72 0) rotate(0) scale(1.45)" cx="0" cy="0" r="96" fill="black" /></mask></defs><g data-scope="geometric-scope" data-operation="difference" data-conductive="false"><g mask="url(#scope-2-scope-difference)"><rect x="-665" y="-665" width="1330" height="1330" fill="#81b9ad" opacity=".12" /></g></g><g data-composition-layer="relations" /><g data-node="area-a" data-motif="square" transform="translate(-65 0) rotate(45) scale(1.6)"><circle r="128" fill="transparent" stroke="none" data-hit="true" /><path d="M-69.2965 -69.2965 L69.2965 -69.2965 L69.2965 69.2965 L-69.2965 69.2965 Z" fill="none" stroke="#e2c58b" stroke-width="1.3" data-layer="frame" /></g><g data-node="area-b" data-motif="circle" transform="translate(72 0) rotate(0) scale(1.45)"><circle r="128" fill="transparent" stroke="none" data-hit="true" /><circle cx="0" cy="0" r="96" fill="none" stroke="#e2c58b" stroke-width="1.2" data-layer="frame" /></g></g></svg><text x="927" y="549" font-size="20" fill="#d7bd88">A扣除B</text><text x="927" y="578" font-size="12" fill="#9aaba1">取A内部、同时不在B内部的区域，A与B的次序有区别。</text><text x="55" y="625" font-size="12" fill="#9aaba1">这里定义空间范围候选；不把相交区域自动当成布尔判断、线路接通或实际作用。</text></g></svg>